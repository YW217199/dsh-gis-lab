<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>研一 WebGIS 学习看板</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="site-header">
    <h1>研一 WebGIS 学习看板</h1>
    <p class="subtitle">
      湖北大学 · 地图学与地理信息系统 ·
      <span id="today"></span>
    </p>
  </header>

  <main>
    <!-- 1. 环境状态：JS 往这里插卡片 -->
    <section class="block">
      <h2>环境状态</h2>
      <div id="env-grid" class="card-grid"></div>
    </section>

    <!-- 2. 阶段进度：JS 往这里插卡片 -->
    <section class="block">
      <h2>阶段进度</h2>
      <div id="phase-grid" class="card-grid"></div>
    </section>

    <!-- 3. 周计划表：支持搜索 / 筛选 / 排序 -->
    <section class="block">
      <h2>周计划</h2>

      <div class="toolbar">
        <input
          id="search-input"
          type="search"
          placeholder="搜索周次、主题或学习内容…"
          aria-label="搜索周计划"
        />
        <select id="phase-select" aria-label="按阶段筛选">
          <option value="all">全部阶段</option>
          <option value="1">阶段一 · 地图前端入门</option>
          <option value="2">阶段二 · 引擎升级 + Vue3 + 空间分析</option>
          <option value="3">CNN 并行线</option>
        </select>
        <select id="sort-select" aria-label="排序方式">
          <option value="asc">周次升序</option>
          <option value="desc">周次降序</option>
        </select>
        <span id="result-count" class="result-count"></span>
      </div>

      <div class="table-wrap">
        <table class="roadmap-table">
          <thead>
            <tr>
              <th>周次</th>
              <th>主题</th>
              <th>核心内容</th>
              <th>状态</th>
            </tr>
          </thead>
          <tbody id="roadmap-body"></tbody>
        </table>
      </div>
    </section>

    <!-- 4. 地图占位：第 3 周替换成真正的 Leaflet 地图 -->
    <section class="block">
      <h2>地图区（第 3 周上线）</h2>
      <div id="map-placeholder" class="map-placeholder">
        <p>这里将放一张 Leaflet 地图。</p>
        <p class="muted">第 3 周任务：接入 Leaflet + OSM 底图，中心设在武汉。</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>
      数据来源：本地 <code>js/data.js</code> ·
      本页仅用于个人学习记录
    </p>
  </footer>

  <script src="./js/data.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
